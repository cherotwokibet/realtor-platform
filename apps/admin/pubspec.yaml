name: realtor_admin
description: Staff admin (Flutter web). Brand comes from assets/tenant/, written by `melos run app:prepare -- <tenant-id>`.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  realtor_core:
    path: ../../packages/core
  realtor_ui:
    path: ../../packages/ui
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  http: ^1.6.0
  firebase_storage: ^14.0.1
  web: ^1.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/tenant/
    - assets/tenant/fonts/
