name: realtor_admin
description: Staff admin (Flutter web). Brand comes from assets/tenant/, written by `melos run app:prepare -- <tenant-id>`.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  realtor_core:
    path: ../../packages/core
  realtor_ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tenant/
    - assets/tenant/fonts/
