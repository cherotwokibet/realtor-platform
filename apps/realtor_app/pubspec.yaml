name: realtor_app
description: Customer app (Android, iOS, web). Brand and features come from assets/tenant/, written by `melos run app:prepare -- <tenant-id>`.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  url_launcher: ^6.3.1
  realtor_core:
    path: ../../packages/core
  realtor_ui:
    path: ../../packages/ui
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/tenant/
    - assets/tenant/fonts/
    # BEGIN tenant flavors (written by `tenant flavors`; keep this block empty in git)
    # END tenant flavors
