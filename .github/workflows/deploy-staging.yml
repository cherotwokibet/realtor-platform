# Staging follows main (P0-s05): every night, if main changed in the last
# day, the whole stack (functions, images, infra, web) is deployed to the
# tenant's stage project with the same `tenant deploy` Boniface runs by hand.
# Off until the repository variables in docs/staging-deploy.md are set; it
# signs in with Workload Identity Federation, so no key is stored anywhere.
name: Deploy staging

on:
  schedule:
    - cron: '0 23 * * *' # 02:00 in Nairobi
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if main has not changed today
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  deploy:
    if: vars.STAGE_WIF_PROVIDER != '' && vars.STAGE_DEPLOY_SA != '' && vars.STAGE_TENANT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TENANT: ${{ vars.STAGE_TENANT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 50

      - name: Anything new on main today?
        id: changed
        run: |
          n=$(git log --since='25 hours ago' --oneline | wc -l)
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          echo "$n commit(s) on main in the last 25 hours"

      - name: Nothing to deploy
        if: steps.changed.outputs.commits == '0' && github.event.inputs.force != 'true'
        run: echo "main has not changed since the last nightly run; staging is current."

      - if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGE_WIF_PROVIDER }}
          service_account: ${{ vars.STAGE_DEPLOY_SA }}

      - if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the version the code is built and tested with (3.50 deprecates
          # package:flutter/material.dart; moving to material_ui is its own change).
          flutter-version: 3.47.8
          cache: true

      - name: Tools
        if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        run: |
          npm install -g firebase-tools
          npm ci --prefix functions
          npm ci --prefix tools/tenant-cli
          flutter pub get

      - name: Deploy to stage
        if: steps.changed.outputs.commits != '0' || github.event.inputs.force == 'true'
        run: node tools/tenant-cli/src/cli.ts deploy "$TENANT" stage --yes
