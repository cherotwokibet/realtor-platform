name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions minutes are limited, so each job runs only when files it checks
# change (pull requests: against the base; main: against the previous push).
# Editing this file runs everything. The Android and web builds, the slowest
# jobs (most of a full run), run on pull requests only: not in draft, not on
# main pushes (the pull request already built the same code), and not for
# changes in packages/core, tokens or fonts alone, which `dart analyze
# packages apps` already compiles every app against. Android builds only when
# flavors could change (tenants, brand, tenant CLI, dependencies); the web
# build does one tenant unless tenants or brand change. The `full-ci` label
# on a pull request runs everything. Every job has a timeout.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functions: ${{ steps.f.outputs.functions }}
      dart: ${{ steps.f.outputs.dart }}
      app: ${{ steps.f.outputs.app }}
      android: ${{ steps.f.outputs.android }}
      tenants: ${{ steps.f.outputs.tenants }}
      tooling: ${{ steps.f.outputs.tooling }}
      admin: ${{ steps.f.outputs.admin }}
      infra: ${{ steps.f.outputs.infra }}
      share: ${{ steps.f.outputs.share }}
      emulator: ${{ steps.f.outputs.emulator }}
      search: ${{ steps.f.outputs.search }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' }}
        run: |
          if [ "$OTHER_LABEL" = true ]; then  # only the full-ci label starts a run
            for o in tooling functions dart app admin android tenants infra share emulator search; do echo "$o=false" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          all=0; files=""
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all=1
          else files=$(git diff --name-only "$BASE" HEAD); fi
          printf '%s\n' "$files" | grep -q '^\.github/workflows/' && all=1
          echo "all=$all"; printf '%s\n' "$files"
          if [ "$FULL" = true ]; then all=1; fi  # the full-ci label runs everything
          has() { [ "$all" = 1 ] || printf '%s\n' "$files" | grep -qE "$1"; }
          out() { if has "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          shared='^(packages/core|packages/tokens|tenants|brand|fonts|tools/tenant-cli)/|^pubspec\.'
          # tooling also runs the no-tenant-in-code scan over the product code.
          out tooling '^(tenants|brand|fonts|tools/tenant-cli)/|^(apps/[^/]+/(lib|bin)|packages/[^/]+/lib|functions/src)/'
          out functions '^functions/|^(firestore|storage)\.rules$'
          out dart "$shared|^(packages|apps)/|^analysis_options\.yaml$|^functions/src/model/transitions\.json$"
          builds='^(tenants|brand|tools/tenant-cli)/|^pubspec\.'
          # Android (the slowest job) only when flavors could change, or with the full-ci label.
          flavors='^(tenants|brand|tools/tenant-cli)/|^pubspec\.|^apps/realtor_app/(pubspec|flutter_launcher_icons|flutter_native_splash)'
          if [ "$DRAFT" = true ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            for o in app admin android tenants; do echo "$o=false" >> "$GITHUB_OUTPUT"; done
          else
            out app "$builds|^(packages/ui|apps/realtor_app)/"; out admin "$builds|^(packages/ui|apps/admin)/"
            out android "$flavors"; out tenants '^(tenants|brand)/'
          fi
          out infra '^infra/|^tenants/|^(firestore|storage)\.rules$'
          out share '^(packages/core|packages/tokens|tenants|fonts|apps/share_pages)/|^\.dockerignore$'
          out emulator '^(functions|apps/share_pages|packages/core|tools/load)/|^(firestore|storage)\.rules$|^firestore\.indexes\.json$|^firebase\.json$'
          out search '^functions/(src/search|src/seed|src/model|package)'
          cat "$GITHUB_OUTPUT"

  tenants:
    name: Tenant files + tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - run: npx tsc --noEmit
        working-directory: tools/tenant-cli
      - name: Validate every tenant (schema, assets, contrast)
        run: node tools/tenant-cli/src/cli.ts validate
      - name: Tests (incl. icon sizes and safe zones)
        run: npm test
        working-directory: tools/tenant-cli

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  dart:
    name: Dart + Flutter packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - name: Install tenant-cli
        run: npm ci
        working-directory: tools/tenant-cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Resolve workspace
        run: flutter pub get
      - name: Prepare app assets (Realtime Estates)
        run: node tools/tenant-cli/src/cli.ts prepare realtime-estates
      - name: Analyse
        run: dart analyze --fatal-infos packages apps
      - name: Test core + tokens (pure Dart)
        run: |
          (cd packages/core && dart test)
          (cd packages/tokens && dart test)
      - name: Share pages (Jaspr SSR) tests + server binary
        working-directory: apps/share_pages
        run: |
          dart test -x emulator
          mkdir -p build && dart compile exe bin/server.dart -o build/server
      - name: Test ui + app (Flutter)
        run: |
          (cd packages/ui && flutter test)
          (cd apps/realtor_app && flutter test)
          (cd apps/admin && flutter test)
      - name: Dart and TS emit identical CSS
        run: |
          for t in realtime-estates demo-homes; do
            node tools/tenant-cli/src/cli.ts css "$t" >/dev/null
            (cd packages/tokens && dart run realtor_tokens:css "$t") > "/tmp/$t.dart.css"
            diff -u "build/tokens/$t.css" "/tmp/$t.dart.css"
          done

  web:
    name: Web build per tenant (proves the clone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, dart]
    if: needs.changes.outputs.app == 'true'
    strategy:
      matrix:
        # The second tenant proves the clone; it builds only when tenants or brand change.
        tenant: ${{ fromJSON(needs.changes.outputs.tenants == 'true' && '["realtime-estates","demo-homes"]' || '["demo-homes"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare ${{ matrix.tenant }}
        run: node tools/tenant-cli/src/cli.ts prepare ${{ matrix.tenant }}
      - name: Platform folders, launcher icons, splash
        working-directory: apps/realtor_app
        run: |
          flutter create . --platforms=android,ios,web --project-name realtor_app >/dev/null
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          node ../../tools/tenant-cli/src/cli.ts web ${{ matrix.tenant }}
      - name: Build web (WebAssembly, JS fallback)
        working-directory: apps/realtor_app
        run: |
          flutter build web --release --wasm
          ! grep -q "A new Flutter project" build/web/index.html
          test -f build/web/main.dart.wasm

  admin:
    name: Admin web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, dart]
    if: needs.changes.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: node tools/tenant-cli/src/cli.ts prepare realtime-estates
      - name: Build web
        working-directory: apps/admin
        run: |
          flutter create . --platforms=web --project-name realtor_admin >/dev/null
          rm -f test/widget_test.dart
          flutter build web --release
          test -f build/web/main.dart.js

  android:
    name: Android flavors (every tenant, side by side)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, dart]
    if: needs.changes.outputs.android == 'true'
    steps:
      # A dead runner uploads no log at all; a full disk is the usual cause.
      # Drop toolchains this job never uses (.NET, Haskell, CodeQL, Swift).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android folder + one flavor per tenant
        working-directory: apps/realtor_app
        run: |
          flutter create . --platforms=android --project-name realtor_app >/dev/null
          node ../../tools/tenant-cli/src/cli.ts flavors
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create --flavors "$(ls assets/flavors | paste -sd, -)"
          # The template gives Gradle an 8 GB heap and the Kotlin daemon
          # inherits it: with native plugins that is more than the 16 GB
          # runner has, and the runner dies mid-build with no log.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx2g' >> android/gradle.properties
          grep -E 'jvmargs' android/gradle.properties
      - name: Build a debug APK per flavor
        working-directory: apps/realtor_app
        run: |
          for f in $(ls assets/flavors); do
            flutter build apk --debug --flavor "$f"
            # Keep the APK, drop the intermediates before the next flavor.
            rm -rf build/app/intermediates build/app/tmp
            df -h / | tail -1
          done
      - name: Distinct application ids (install side by side)
        working-directory: apps/realtor_app
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          ids=""
          for apk in build/app/outputs/flutter-apk/app-*-debug.apk; do
            id=$("$aapt2" dump packagename "$apk")
            label=$("$aapt2" dump badging "$apk" | sed -n "s/^application-label:'\(.*\)'/\1/p")
            echo "$apk → $id ($label)"
            ids="$ids$id"$'\n'
          done
          test "$(printf '%s' "$ids" | sort | uniq -d)" = "" || { echo "duplicate application ids"; exit 1; }
          test "$(printf '%s' "$ids" | grep -c .)" -ge 2
      - name: App Links (each flavor opens its own share domain)
        working-directory: apps/realtor_app
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for f in $(ls assets/flavors); do
            apk=build/app/outputs/flutter-apk/$(ls build/app/outputs/flutter-apk | grep -i "^app-$f-debug\.apk$")
            host=$(node -e 'const fs=require("fs");for(const x of fs.readdirSync("../../tenants").filter(n=>n.endsWith(".json"))){const t=JSON.parse(fs.readFileSync("../../tenants/"+x,"utf8"));if(t.id.replace(/-([a-z0-9])/g,(_,c)=>c.toUpperCase())===process.argv[1])console.log(t.domains.share)}' "$f")
            tree=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            echo "$tree" | grep -qE "host\(0x[0-9a-f]+\)=\"$host\"" || { echo "$f: no App Link for $host"; exit 1; }
            echo "$tree" | grep -q 'autoVerify' || { echo "$f: autoVerify missing"; exit 1; }
            echo "$f → https://$host/listing/… opens the app"
          done

  terraform:
    name: Terraform (format + validate, never applied)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/tenant
      - run: terraform validate
        working-directory: infra/terraform/tenant

  share-image:
    name: Share pages image (docker build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.share == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Build the Cloud Run image for demo-homes
        run: docker build -f apps/share_pages/Dockerfile --build-arg TENANT=demo-homes -t share-pages .
      - name: Smoke test the image
        run: |
          docker run -d --name sp -p 8080:8080 -e FIRESTORE_EMULATOR_HOST=localhost:1 share-pages
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/robots.txt | grep -q '^Sitemap: https://'
          curl -fsS localhost:8080/fonts/Manrope-Regular.ttf -o /tmp/f.ttf && test $(stat -c %s /tmp/f.ttf) -gt 10000
          docker logs sp

  emulator:
    name: Emulators (seed, rules, callable API, media)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.emulator == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Seed the emulator, read it back, and serve share pages from it
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-realtor "npm --prefix functions run seed && cd apps/share_pages && dart test -t emulator"
      - uses: grafana/setup-k6-action@v1
      - name: Load test scripts parse, and share pages pass the k6 smoke run
        run: |
          k6 inspect tools/load/search.js > /dev/null
          npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-realtor "npm --prefix functions run seed && tools/load/smoke-share-pages.sh"
      - name: Security rules tests
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,storage --project demo-realtor "npm --prefix functions run test:rules"
      - name: Callable API + media pipeline tests
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,storage --project demo-realtor "npm --prefix functions run test:emulator"

  search:
    name: Typesense search (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.search == 'true'
    services:
      typesense:
        image: typesense/typesense:29.0
        ports:
          - 8108:8108
        env:
          TYPESENSE_API_KEY: ci-only-not-a-secret
          TYPESENSE_DATA_DIR: /tmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Wait for Typesense
        run: for i in $(seq 1 30); do curl -fs localhost:8108/health && exit 0; sleep 2; done; exit 1
      - name: Index the seed and search it
        working-directory: functions
        env:
          TYPESENSE_HOST: localhost
          TYPESENSE_API_KEY: ci-only-not-a-secret
        run: npm run test:typesense
