name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenants:
    name: Tenant files + tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - run: npx tsc --noEmit
        working-directory: tools/tenant-cli
      - name: Validate every tenant (schema, assets, contrast)
        run: node tools/tenant-cli/src/cli.ts validate
      - name: Tests (incl. icon sizes and safe zones)
        run: npm test
        working-directory: tools/tenant-cli

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  dart:
    name: Dart + Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - name: Install tenant-cli
        run: npm ci
        working-directory: tools/tenant-cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Resolve workspace
        run: flutter pub get
      - name: Prepare app assets (Realtime Estates)
        run: node tools/tenant-cli/src/cli.ts prepare realtime-estates
      - name: Analyse
        run: dart analyze --fatal-infos packages apps
      - name: Test core + tokens (pure Dart)
        run: |
          (cd packages/core && dart test)
          (cd packages/tokens && dart test)
      - name: Test ui + app (Flutter)
        run: |
          (cd packages/ui && flutter test)
          (cd apps/realtor_app && flutter test)
      - name: Dart and TS emit identical CSS
        run: |
          for t in realtime-estates demo-homes; do
            node tools/tenant-cli/src/cli.ts css "$t" >/dev/null
            (cd packages/tokens && dart run realtor_tokens:css "$t") > "/tmp/$t.dart.css"
            diff -u "build/tokens/$t.css" "/tmp/$t.dart.css"
          done

  web:
    name: Web build per tenant (proves the clone)
    runs-on: ubuntu-latest
    needs: dart
    strategy:
      matrix:
        tenant: [realtime-estates, demo-homes]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tenant-cli/package-lock.json
      - run: npm ci
        working-directory: tools/tenant-cli
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare ${{ matrix.tenant }}
        run: node tools/tenant-cli/src/cli.ts prepare ${{ matrix.tenant }}
      - name: Platform folders, launcher icons, splash
        working-directory: apps/realtor_app
        run: |
          flutter create . --platforms=android,ios,web --project-name realtor_app >/dev/null
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build web
        working-directory: apps/realtor_app
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.tenant }}
          path: apps/realtor_app/build/web
          retention-days: 7

  emulator:
    name: Emulators (seed, rules, callable API, media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - name: Seed the emulator and read it back
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-realtor "npm --prefix functions run seed"
      - name: Security rules tests
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,storage --project demo-realtor "npm --prefix functions run test:rules"
      - name: Callable API + media pipeline tests
        run: npx --yes firebase-tools@15 emulators:exec --only firestore,storage --project demo-realtor "npm --prefix functions run test:emulator"
