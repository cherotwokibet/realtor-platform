# Monthly dependency updates (each pull request costs a CI run), grouped so each ecosystem opens at most one PR
# for minor and patch bumps. Security updates arrive on their own as needed.
# Every PR runs the full CI before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/functions", "/tools/tenant-cli"]
    schedule: { interval: monthly, time: "05:00", timezone: Africa/Nairobi }
    open-pull-requests-limit: 2
    ignore:
      # Types follow the Node runtime (22, functions and tenant-cli engines).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # The client SDK and the rules test kit peer-depend on each other's
      # major, so they move together, majors included.
      firebase-test-sdk:
        patterns: ["firebase", "@firebase/rules-unit-testing"]
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: "/"
    schedule: { interval: monthly, time: "05:00", timezone: Africa/Nairobi }
    open-pull-requests-limit: 2
    groups:
      pub-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly, time: "05:00", timezone: Africa/Nairobi }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/apps/share_pages"
    schedule: { interval: monthly, time: "05:00", timezone: Africa/Nairobi }
