name: realtor_ui
description: Flutter theme and widgets shared by the customer app and admin, plus the Firebase Hosting config loader. Reads tokens only; no hex values.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  realtor_core:
    path: ../core
  realtor_tokens:
    path: ../tokens
  firebase_core: ^5.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
